# Dependency advisories are checked with Composer (`composer security:audit`).
# Dependabot is intentionally not configured.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_NO_PROGRESS: "1"

jobs:
  quality:
    name: Static analysis and gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-php
      - run: composer update --prefer-dist
      - name: Cache PHPStan results
        uses: actions/cache@v5
        with:
          path: build/phpstan
          key: phpstan-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon', 'packages/*/extension.neon') }}-${{ github.sha }}
          restore-keys: phpstan-${{ runner.os }}-${{ hashFiles('composer.lock', 'phpstan.neon', 'packages/*/extension.neon') }}-
      - run: composer lint:check
      - run: composer analyse
      - run: composer refactor:check
      - run: composer gate
      - run: composer php-api
      - run: composer error-codes
      - run: composer config-schema
      - run: composer ai:sync
      - run: composer security:audit

  tests:
    name: SQLite tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-php
      - run: composer update --prefer-dist
      - run: composer test:parallel -- --fail-on-empty-test-suite

  postgresql:
    name: PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skm
          POSTGRES_PASSWORD: skm_dev
          POSTGRES_DB: packman_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U skm -d packman_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-php
      - run: composer update --prefer-dist
      - run: composer test:pg -- --fail-on-skipped --fail-on-empty-test-suite

  fixtures:
    name: Consumer fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skm
          POSTGRES_PASSWORD: skm_dev
          POSTGRES_DB: packman_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U skm -d packman_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-php
      - name: Install and test each consumer fixture
        run: |
          set -euo pipefail
          for dir in fixtures/*; do
            if [ -f "$dir/composer.json" ]; then
              if [ -f "$dir/composer.lock" ]; then
                composer install --working-dir="$dir" --no-interaction --prefer-dist --no-progress --ansi
              else
                composer update --working-dir="$dir" --no-interaction --prefer-dist --no-progress --ansi
              fi
              composer test --working-dir="$dir" --no-interaction --ansi -- --fail-on-skipped --fail-on-empty-test-suite
            fi
          done
