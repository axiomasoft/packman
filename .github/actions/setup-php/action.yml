name: Setup PHP
description: Install PHP 8.4 and restore Composer package downloads.

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.4"
        coverage: none
        tools: composer:v2
        extensions: bcmath, ctype, curl, dom, fileinfo, gd, gmp, intl, mbstring, pcntl, pdo_pgsql, pdo_sqlite, sqlite3, tokenizer, xml, zip
        ini-values: memory_limit=2G, assert.exception=1

    - name: Locate Composer download cache
      id: composer-cache
      shell: bash
      run: printf 'path=%s\n' "$(composer config cache-files-dir --absolute)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer package downloads
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.path }}
        key: composer-files-${{ runner.os }}-${{ github.job == 'fixtures' && 'fixtures' || 'monorepo' }}-${{ hashFiles('composer.json', 'packages/*/composer.json', 'fixtures/**/composer.json') }}-${{ github.run_id }}
        restore-keys: |
          composer-files-${{ runner.os }}-${{ github.job == 'fixtures' && 'fixtures' || 'monorepo' }}-${{ hashFiles('composer.json', 'packages/*/composer.json', 'fixtures/**/composer.json') }}-
          composer-files-${{ runner.os }}-${{ github.job == 'fixtures' && 'fixtures' || 'monorepo' }}-
